# XcodeGen 定義。`xcodegen generate` で ShogunAI.xcodeproj を生成する (README 参照)
name: ShogunAI
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # 実機で動かすときは自分の Team ID を入れる (Xcode の Signing & Capabilities でも可)
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  ShogunAI:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - path: Resources
        optional: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ShogunAI
        UILaunchScreen:
          UIColorName: ""
        UIAppFonts: [Outfit-Variable.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Automatic
        CFBundleURLTypes:
          - CFBundleURLSchemes: [shogunai]
    entitlements:
      path: App/ShogunAI.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.shogunai]
    dependencies:
      - target: ShogunAIKeyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.shogunai
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
  ShogunAIKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: Resources
        optional: true
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: ShogunAI
        UIAppFonts: [Outfit-Variable.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/ShogunAIKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.shogunai]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.shogunai.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
