<title>ShogunAI Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: 402×874pt の iPhone フレームを中央に置き、左に画面ジャンプ用の目次。単一のダークな見た目 (録画がダークモードのため) */
:root {
  color-scheme: dark;
  /* Color — Shared/DesignSystem/Tokens.swift と同じ値 */
  --bg: #11161D; --bg-top: #131B28; --card: #242A31; --card-alt: #272C35; --raised: #2F3742;
  --seg-track: #2A2F38; --seg-thumb: #595E6C; --pill-add: #2A3644; --accent: #5094D7; --brand: #034BFF; --toggle-on: #2F86FF;
  --badge-bg: #3C6E9C; --badge-fg: #DCE8ED; --cta-bg: #F1F2F7; --cta-fg: #11161D;
  --text: #FFFFFF; --text-2: #989EA5; --text-3: #5C626B; --hair: rgba(255,255,255,.08); --divider: rgba(255,255,255,.06);
  --danger: #E5484D; --success: #34C759; --hero-a: #E7EAF2; --hero-b: #C9D3E8;
  --kb-bg: #222222; --kb-key: #414141; --kb-special: #2C2C2C; --kb-pressed: #5A5A5A; --kb-box: #303030; --kb-hl: #3D7BF7;
  --chat-bg: #000000; --bubble-in: #242328; --bubble-out: #1F8BFF; --send: #52E76F; --input-bg: #1B1B1B;
  --stage: #07090C; --stage-fg: #C9CED6;
  /* Type */
  --font: "Outfit", ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif;
  --font-sys: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--stage); color: var(--stage-fg); font-family: var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, textarea { font: inherit; color: inherit; }

.stage { min-height: 100%; display: flex; gap: 32px; justify-content: center; align-items: flex-start;
  padding-block: 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.toc { width: 220px; flex: none; position: sticky; top: 24px; display: flex; flex-direction: column; gap: 14px; }
.toc h1 { margin: 0; font-size: 22px; font-weight: 600; color: #fff; letter-spacing: -.01em; }
.toc p { margin: 0; font-size: 13px; line-height: 1.5; color: #8A919B; }
.toc nav { display: flex; flex-direction: column; gap: 2px; }
.toc .grp { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #5C626B; margin: 10px 0 4px; }
.toc nav button { text-align: left; padding: 7px 10px; border-radius: 8px; font-size: 14px; color: #C9CED6; }
.toc nav button:hover { background: #151A21; }
.toc nav button[aria-current="true"] { background: #1C2430; color: #fff; }
.toc .note { font-size: 12px; color: #6B727C; border-top: 1px solid #1A1F27; padding-top: 12px; }

.device { flex: none; width: 402px; height: 874px; border-radius: 56px; padding: 10px; background: #1A1C20;
  box-shadow: 0 0 0 1px #2A2D33, 0 30px 80px rgba(0,0,0,.6); }
.phone { position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden; background: var(--bg); color: var(--text); }
@media (max-width: 720px) {
  .stage { flex-direction: column; align-items: center; gap: 16px; }
  .toc { position: static; width: 100%; max-width: 402px; }
  .toc nav { flex-direction: row; flex-wrap: wrap; }
  .toc .grp { width: 100%; }
}
@media (max-width: 430px) {
  .device { width: 100%; max-width: 402px; height: auto; aspect-ratio: 402 / 874; border-radius: 40px; padding: 6px; }
  .phone { border-radius: 34px; }
}

/* status bar */
.status { position: absolute; inset: 0 0 auto; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 30px 0 38px; z-index: 40; font: 600 16px var(--font-sys); pointer-events: none; }
.island { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; }
.status .r { display: flex; gap: 6px; align-items: center; font-size: 13px; }
.batt { border: 1.5px solid currentColor; border-radius: 4px; padding: 0 3px; font-size: 11px; }
.screen { position: absolute; inset: 0; padding-top: 54px; display: flex; flex-direction: column; }
.bg-grad { background: linear-gradient(var(--bg-top), var(--bg) 220px); }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }
.home-ind { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 134px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.7); z-index: 50; pointer-events: none; }

/* components */
.px { padding-left: 12px; padding-right: 12px; }
.pxs { padding-left: 16px; padding-right: 16px; }
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; }
.circle-btn { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.circle-btn.hl { box-shadow: inset 0 0 0 2px #fff; }
.circle-btn svg { width: 20px; height: 20px; }
.primary { height: 54px; border-radius: 26px; width: 100%; background: var(--cta-bg); color: var(--cta-fg); font-size: 17px; font-weight: 600; transition: transform .1s; }
.primary:active { transform: scale(.97); }
.primary:disabled { opacity: .35; }
.secondary { height: 52px; border-radius: 26px; flex: 1; background: var(--raised); font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; }
.card { background: var(--card); border-radius: 24px; box-shadow: inset 0 0 0 1px var(--hair); }
.card-alt { background: var(--card-alt); border-radius: 20px; box-shadow: inset 0 0 0 1px var(--hair); }
.h-display { font-size: 28px; font-weight: 600; text-align: center; line-height: 1.2; text-wrap: balance; margin: 0; }
.h-title { font-size: 18px; font-weight: 500; margin: 0; letter-spacing: -.005em; }
.t-body { font-size: 15px; line-height: 1.45; }
.t-cap { font-size: 13px; color: var(--text-2); line-height: 1.4; }
.t-micro { font-size: 11px; font-weight: 500; }
.muted { color: var(--text-2); }
.seg { width: 190px; height: 46px; border-radius: 23px; padding: 4px; display: flex; }
.seg button { flex: 1; z-index: 1; font-size: 16px; font-weight: 500; color: var(--text-2); }
.seg button[aria-pressed="true"] { color: var(--text); }
.seg .thumb { position: absolute; top: 4px; bottom: 4px; width: calc(50% - 4px); border-radius: 18px; background: var(--seg-thumb); transition: transform .3s cubic-bezier(.3,1.2,.5,1); }
.chip { height: 36px; padding: 0 16px; border-radius: 18px; background: #262C35; box-shadow: inset 0 0 0 1px var(--hair); font-size: 14px; font-weight: 500; white-space: nowrap; flex: none; }
.subtabs { display: flex; gap: 8px; }
.subtabs button { height: 30px; padding: 0 14px; border-radius: 15px; background: var(--card); font-size: 13px; font-weight: 500; color: var(--text-2); }
.subtabs button[aria-pressed="true"] { background: var(--cta-bg); color: var(--cta-fg); }
.badge { font-size: 11px; font-weight: 500; padding: 2px 6px; border-radius: 5px; }
.badge.new { background: var(--badge-bg); color: var(--badge-fg); }
.badge.free { box-shadow: inset 0 0 0 1px var(--text-3); color: var(--text-2); }
.badge.pro { background: var(--cta-bg); color: var(--cta-fg); }
.add { display: inline-grid; place-items: center; width: 62px; height: 28px; border-radius: 14px; background: var(--pill-add); color: var(--accent); font-size: 14px; font-weight: 500; flex: none; }
.add.on { background: rgba(47,55,66,.6); color: var(--text-2); }
.act-icon { border-radius: 50%; display: grid; place-items: center; flex: none; position: relative; line-height: 1; font-family: 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif; box-shadow: inset 0 -3px 6px rgba(0,0,0,.08), inset 0 2px 3px rgba(255,255,255,.9), 0 2px 6px rgba(0,0,0,.25); }
.act-icon svg { width: 46%; height: 46%; filter: drop-shadow(0 1px 1px rgba(0,0,0,.2)); }
.act-row { display: flex; align-items: center; gap: 14px; height: 72px; width: 100%; text-align: left; position: relative; }
.act-row .nm { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-row + .act-row::before { content: ""; position: absolute; top: 0; left: 62px; right: 0; height: 1px; background: var(--divider); }
.orb { display: inline-block; vertical-align: middle; border-radius: 50%; position: relative; flex: none; background: conic-gradient(from 200deg, #A8D8FF, #4E7BFF, #9B7CFF, #7FE3F0, #A8D8FF); box-shadow: 0 0 22px rgba(110,140,255,.45); }
.orb::before { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 25% 20%, rgba(255,255,255,.85), transparent 60%); }
.orb::after { content: "✦"; position: absolute; inset: 27%; border-radius: 22%; background: rgba(255,255,255,.22); color: #fff; display: grid; place-items: center; font-size: 60%; }
.orb.gray { filter: saturate(0); box-shadow: none; }
.pulse { animation: pulse 1.5s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.08); } }
.brand { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; flex: none; }
.brand i { border-radius: 50%; display: grid; place-items: center; font: 700 10px/1 ui-rounded, var(--font); font-style: normal; box-shadow: inset 0 0 0 1px rgba(255,255,255,.6); }
.brand i.f { background: #fff; color: #000; } .brand i.o { background: rgba(255,255,255,.18); color: #fff; }
.sgroup-title { font-size: 15px; font-weight: 500; color: var(--text-2); padding: 0 4px 8px; display: flex; justify-content: space-between; }
.sgroup { background: var(--card); border-radius: 20px; box-shadow: inset 0 0 0 1px var(--hair); }
.srow { display: flex; align-items: center; gap: 14px; padding: 12px 16px; min-height: 64px; width: 100%; text-align: left; position: relative; }
.srow + .srow::before { content: ""; position: absolute; top: 0; left: 56px; right: 0; height: 1px; background: var(--divider); }
.srow.noicon + .srow.noicon::before, .srow.noicon + .srow::before { left: 16px; }
.srow .ic { width: 28px; display: grid; place-items: center; flex: none; }
.srow .ic svg { width: 22px; height: 22px; }
.srow .ic { color: #E9EDF3; } .srow .ic svg { fill: rgba(80,148,215,.42); } /* 録画の設定アイコンは白線 + 青の塗りの2色 */
.srow .tt { font-size: 16px; font-weight: 400; }
.srow .st { font-size: 13px; color: var(--text-2); margin-top: 2px; line-height: 1.35; }
.chev { color: var(--text-3); display: flex; gap: 6px; align-items: center; font-size: 13px; }
.chev span { color: var(--text-2); }
.toggle { width: 51px; height: 31px; border-radius: 16px; background: #39393D; position: relative; flex: none; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 2px 4px rgba(0,0,0,.3); }
.toggle[aria-checked="true"] { background: var(--toggle-on); }
.toggle[aria-checked="true"]::after { transform: translateX(20px); }
.toggle.green[aria-checked="true"] { background: var(--success); }
.steps { padding: 16px; }
.steps input[type=range] { width: 100%; accent-color: #fff; }
.steps .lbls { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-2); margin-top: 4px; }
.steps .lbls b { color: var(--text); font-weight: 500; }
.navh { height: 56px; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 0 16px; gap: 8px; flex: none; }
.navh h2 { margin: 0; text-align: center; font-size: 17px; font-weight: 600; }
.coach { background: #fff; color: #000; font-size: 13px; font-weight: 500; padding: 8px 12px; border-radius: 10px; box-shadow: 0 4px 16px rgba(0,0,0,.3); white-space: nowrap; }
.hand { font-size: 32px; color: #8FB4FF; animation: tap 1.2s ease-in-out infinite; display: inline-block; filter: drop-shadow(0 2px 4px rgba(0,0,0,.3)); }
@keyframes tap { 50% { transform: translateY(6px) scale(.92); } }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-2); animation: dot 1s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes dot { 0%, 100% { opacity: .3; } 30% { opacity: 1; } }
.sheet-wrap { position: absolute; inset: 0; z-index: 30; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; animation: fade .2s; }
.sheet { width: 100%; height: calc(100% - 64px); background: var(--bg); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .3s cubic-bezier(.2,.9,.3,1); overflow: hidden; }
.sheet.half { height: 58%; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }
.fadein { animation: fade .25s; }
.toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(40,44,52,.95); padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 60; animation: fade .2s; white-space: nowrap; }

/* keyboard */
.kb { background: var(--kb-bg); flex: none; user-select: none; -webkit-user-select: none; touch-action: none; padding-bottom: 30px; }
.kb-bar { height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 8px; }
.ta { display: flex; padding: 2px; border-radius: 15px; background: var(--kb-special); position: relative; }
.ta button { height: 26px; padding: 0 10px; border-radius: 13px; font-size: 13px; font-weight: 500; color: var(--text-2); display: flex; align-items: center; gap: 4px; }
.ta button[aria-pressed="true"] { background: var(--kb-key); color: #fff; }
.kb-pill { height: 28px; padding: 0 10px; border-radius: 14px; background: var(--kb-key); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 4px; }
.kb-body { height: 220px; position: relative; }
.keys { position: absolute; inset: 0; padding: 8px 3px 4px; display: flex; flex-direction: column; gap: 12px; transition: opacity .2s; }
.keys.dim { opacity: .25; }
.krow { display: flex; gap: 6px; justify-content: center; }
.key { height: 42px; border-radius: 8px; background: var(--kb-key); box-shadow: 0 1px 0 rgba(0,0,0,.35); display: grid; place-items: center; font: 400 23px var(--font-sys); position: relative; flex: 1; }
.key.sp { background: var(--kb-special); font-size: 16px; }
.key.down { background: var(--kb-pressed); }
.key .pv { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); width: 52px; height: 56px; border-radius: 10px; background: var(--kb-pressed); display: grid; place-items: center; font-size: 32px; pointer-events: none; }
.key.space { flex: 5; font-size: 15px; color: var(--text-2); }
.key.space.hl { box-shadow: inset 0 0 0 2px var(--kb-hl); background: var(--kb-pressed); }
.wheel { position: absolute; inset: 0; pointer-events: none; }
.wheel .halo { position: absolute; border-radius: 50%; background: radial-gradient(rgba(255,255,255,.28), rgba(143,180,255,.18) 50%, transparent 70%); }
.wheel .ring { position: absolute; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.wheel .slot { position: absolute; transform: translate(-50%, -50%); transition: transform .2s; }
.wheel .slot.sel { transform: translate(-50%, -50%) scale(1.28); }
.wheel .lbl { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 13px; color: var(--text-2); }
.wheel .lbl.on { color: #fff; font-size: 15px; font-weight: 500; }
.wheel .plus { width: 40px; height: 40px; border-radius: 50%; border: 1px dashed var(--text-3); display: grid; place-items: center; color: var(--text-3); }
.panel { position: absolute; inset: 0; padding: 8px 12px; display: flex; flex-direction: column; gap: 10px; }
.panel .box { flex: 1; background: var(--kb-box); border-radius: 16px; box-shadow: inset 0 0 0 1px var(--hair); padding: 14px; overflow-y: auto; white-space: pre-wrap; font-size: 15px; line-height: 1.45; }
.panel .btns { display: flex; gap: 8px; }
.panel .btns button { flex: 1; height: 36px; border-radius: 18px; background: var(--kb-key); font-size: 13px; font-weight: 500; }
.acts-grid { position: absolute; inset: 0; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; overflow-y: auto; }
.acts-grid button { height: 48px; border-radius: 12px; background: var(--kb-key); display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 13px; font-weight: 500; text-align: left; }
.acts-grid button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* chat */
.chat { background: var(--chat-bg); }
.bubble { max-width: 75%; padding: 10px 14px; border-radius: 18px; font: 16px/1.35 var(--font-sys); white-space: pre-wrap; }
.bubble.in { background: var(--bubble-in); align-self: flex-start; }
.bubble.out { background: var(--bubble-out); align-self: flex-end; }
.composer { display: flex; gap: 10px; align-items: center; padding: 8px 12px; }
.composer .plus { width: 38px; height: 38px; border-radius: 50%; background: var(--bubble-in); display: grid; place-items: center; font-size: 22px; flex: none; }
.composer .field { flex: 1; min-width: 0; min-height: 40px; border-radius: 20px; background: var(--input-bg); box-shadow: inset 0 0 0 1px var(--hair); display: flex; align-items: center; padding: 4px 4px 4px 14px; gap: 6px; font: 16px var(--font-sys); }
.composer .field .tx { flex: 1; min-width: 0; white-space: pre-wrap; max-height: 88px; overflow-y: auto; }
.composer .field .tx.sel { background: rgba(61,123,247,.35); }
.composer .send { width: 30px; height: 30px; border-radius: 50%; background: var(--send); display: grid; place-items: center; flex: none; color: #fff; font-weight: 700; }
.composer .send:disabled { background: var(--text-3); }

/* hero */
.hero { height: 204px; border-radius: 28px; overflow: hidden; position: relative; display: block; width: 100%;
  background: radial-gradient(120px 80px at 18% 30%, rgba(255,255,255,.7), transparent 70%), radial-gradient(160px 90px at 82% 22%, rgba(255,255,255,.55), transparent 70%), linear-gradient(170deg, #EEF1F7 0%, #D8DEEA 55%, #C5CEDF 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.95), inset 0 0 0 1px rgba(255,255,255,.55); }
.hero .plat { position: absolute; border-radius: 10px; background: linear-gradient(160deg, rgba(255,255,255,.85), rgba(210,218,232,.6)); box-shadow: 0 6px 14px rgba(80,95,130,.18); transform: skewX(-24deg) rotate(-6deg); }
.hero .kbill { position: absolute; left: 0; right: 0; bottom: -18px; transform: perspective(380px) rotateX(28deg); color: #4A5568; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.hero .kbill .r { display: flex; gap: 6px; }
.hero .kbill .r i { width: 22px; height: 26px; border-radius: 6px; background: rgba(255,255,255,.75); display: grid; place-items: center; font: 14px ui-rounded, var(--font); font-style: normal; }
.hero .kbill .r.b i { background: rgba(255,255,255,.5); filter: blur(2px); }
.hero .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding-bottom: 12px; }
.hero .center b { color: #11161D; font-size: 24px; font-weight: 600; letter-spacing: -.01em; }
.hsec { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 0 12px; scrollbar-width: none; }
.hsec::-webkit-scrollbar { display: none; }
.hsec .card { flex: none; width: calc(100% - 48px); scroll-snap-align: start; padding: 6px 16px; }
.composer-bar { position: absolute; left: 14px; right: 14px; bottom: 30px; height: 54px; border-radius: 27px; display: flex; align-items: center; gap: 10px; padding: 0 18px; font-size: 15px; color: var(--text-2); z-index: 5; text-align: left; }


/* ---------- Liquid Glass (iOS 26) ----------
   使う場所は「内容の上に浮く操作レイヤー」だけ: 上部の丸ボタン・All/My・検索、下部の入力バー、詳細画面の Remix/Add。
   カードやリスト (内容レイヤー) は不透明のまま。内容が下を流れて透けることでガラスに見える。 */
.circle-btn, .seg, .float-bottom .secondary { position: relative; }
.circle-btn, .seg, .composer-bar, .float-bottom .secondary {
  isolation: isolate;
  background: rgba(118, 128, 146, .14);
  -webkit-backdrop-filter: blur(5px) saturate(180%) brightness(1.12); backdrop-filter: blur(5px) saturate(180%) brightness(1.12);
  box-shadow:
    inset 1px 1px 0 -.5px rgba(255,255,255,.55),
    inset -1px -1px 0 -.5px rgba(255,255,255,.28),
    inset 0 0 0 .5px rgba(255,255,255,.14),
    inset 0 0 14px rgba(255,255,255,.04),
    0 6px 20px rgba(0,0,0,.30);
  transition: transform .35s cubic-bezier(.3,1.6,.45,1), filter .2s;
}
.circle-btn::after, .seg::after, .composer-bar::after, .float-bottom .secondary::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
  background: linear-gradient(140deg, rgba(255,255,255,.20), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 72%, rgba(255,255,255,.07));
}
.circle-btn:active, .composer-bar:active, .float-bottom .secondary:active { transform: scale(1.07); filter: brightness(1.18); }
.circle-btn.hl { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.95), 0 0 0 3px rgba(255,255,255,.12), 0 6px 20px rgba(0,0,0,.3); }

// demo logic
const wait = ms => new Promise(r => setTimeout(r, ms));
async function startDemo() {
  const d = S.demo; if (d.stage !== 'intro') return;
  d.stage = 'starting'; d.typing = true; render(); await wait(900);
  d.typing = false; d.msgs.push({ t: 'Want to catch a movie this weekend? Anything good out? 🍿' }); render(); await wait(500);
  d.input = 'Recent movies'; d.sel = true; d.hint = 'space'; d.stage = 'first'; render();
}
async function runAct(act) {
  const d = S.demo; const input = d.input;
  d.act = act; d.mode = 'panel'; d.panel = 'thinking'; d.hint = null; render();
  await wait(1500); const out = respond(act, input); d.panel = out; render();
  S.history.unshift({ name: act.name, input, out });
  if (act.output === 'In-Place Replace') { await wait(700); applyResult('replace'); }
}
function applyResult(kind) {
  const d = S.demo; const out = d.panel; if (!out || out === 'thinking') return;
  if (kind === 'replace') d.input = out; else if (kind === 'append') d.input = d.input + '\n' + out; else toast('Copied');
  d.sel = false; d.mode = 'typing'; d.act = null;
  if (d.stage === 'first') d.stage = 'firstReady'; else if (d.stage === 'second') d.stage = 'secondReady';
  render();
}
async function send() {
  const d = S.demo; const t = d.input.trim(); if (!t) return;
  d.msgs.push({ t, out: true }); d.input = ''; d.sel = false; d.hint = null; const st = d.stage; render(); scrollMsgs();
  await wait(600); d.typing = true; render(); scrollMsgs(); await wait(1100); d.typing = false;
  if (['first', 'firstReady', 'starting', 'intro'].includes(st)) {
    d.msgs.push({ t: "Ooh, sounds fun! I'll be downtown — any theaters around there?" }); render(); scrollMsgs(); await wait(500);
    d.input = 'Nearby cinemas'; d.sel = true; d.hint = 'acts'; d.stage = 'second'; render();
  } else {
    d.msgs.push({ t: "Perfect! Popcorn's on me 🍿" }); d.stage = 'done'; render(); scrollMsgs(); await wait(900); d.done = true; render();
  }
}
const scrollMsgs = () => { const m = phone.querySelector('#msgs'); if (m) m.scrollTop = m.scrollHeight; };
function typeChar(c) {
  const d = S.demo; const ch = d.shift ? c.toUpperCase() : c;
  if (d.sel) { d.input = ch; d.sel = false; } else d.input += ch;
  d.shift = false; render();
}

// space bar: tap / long-press wheel
function bindKeyboard() {
  const keys = phone.querySelector('#keys'); if (!keys) return;
  keys.addEventListener('pointerdown', e => {
    const k = e.target.closest('.key'); if (!k) return;
    if (k.id === 'space') return spaceDown(e, k);
    k.classList.add('down');
    if (k.dataset.ch && S.kb.preview && S.demo.layer === 'abc') k.insertAdjacentHTML('beforeend', `<span class="pv">${k.textContent}</span>`);
    const up = () => { k.classList.remove('down'); k.querySelector('.pv')?.remove(); keyAction(k); };
    k.addEventListener('pointerup', up, { once: true });
    k.addEventListener('pointerleave', () => { k.classList.remove('down'); k.querySelector('.pv')?.remove(); }, { once: true });
  });
}
function keyAction(k) {
  const d = S.demo;
  if (k.dataset.ch) return typeChar(k.dataset.ch);
  switch (k.dataset.k) {
    case 'shift': d.shift = !d.shift; break;
    case 'del': if (d.sel) { d.input = ''; d.sel = false; } else d.input = d.input.slice(0, -1); break;
    case 'layer': d.layer = d.layer === 'abc' ? '123' : 'abc'; break;
    case 'emoji': d.input += '🙂'; break;
    case 'ret': d.input += '\n'; break;
  }
  render();
}
function wheelPoints(w, h) { const c = [w / 2, h - 14], r = Math.min(w * .36, h * .78); return [166, 128, 90, 52, 14].map(a => [c[0] + r * Math.cos(a * Math.PI / 180), c[1] - r * Math.sin(a * Math.PI / 180)]); }
function spaceDown(e, el) {
  const body = phone.querySelector('.kb-body'), wheel = phone.querySelector('#wheel'), keys = phone.querySelector('#keys');
  const rect = body.getBoundingClientRect(); const scale = rect.width / body.offsetWidth || 1;
  el.setPointerCapture(e.pointerId); el.classList.add('down');
  let open = false, sel = null; const sx = e.clientX;
  const pts = wheelPoints(body.offsetWidth, body.offsetHeight);
  const drawWheel = () => {
    const c = [body.offsetWidth / 2, body.offsetHeight - 14], r = Math.hypot(pts[2][0] - c[0], pts[2][1] - c[1]);
    const item = sel != null ? findAct(S.wheel[sel]) : null;
    wheel.innerHTML = `<div class="halo" style="left:${c[0] - r * 1.35}px;top:${c[1] - r * 1.35}px;width:${r * 2.7}px;height:${r * 2.7}px"></div><div class="ring" style="left:${c[0] - r}px;top:${c[1] - r}px;width:${r * 2}px;height:${r * 2}px"></div>
      <div class="lbl ${item ? 'on' : ''}">${item ? esc(item.name) : 'Release to cancel'}</div>
      ${pts.map((p, i) => { const a = findAct(S.wheel[i]); return `<div class="slot ${sel === i ? 'sel' : ''}" style="left:${p[0]}px;top:${p[1]}px">${a ? actIcon(a, i === 2 ? 46 : 44) : '<span class="plus">+</span>'}</div>`; }).join('')}`;
  };
  const timer = setTimeout(() => { open = true; S.demo.hint = null; phone.querySelectorAll('.coach,.hand').forEach(n => { if (n.closest('.kb-body')) n.parentElement.remove(); }); el.classList.remove('hl'); keys.classList.add('dim'); wheel.hidden = false; drawWheel(); }, 350);
  const move = ev => {
    if (!open) { if (Math.abs(ev.clientX - sx) > 12) clearTimeout(timer); return; }
    const x = (ev.clientX - rect.left) / scale, y = (ev.clientY - rect.top) / scale;
    let best = null, bd = 56; pts.forEach((p, i) => { const dd = Math.hypot(p[0] - x, p[1] - y); if (dd < bd && S.wheel[i]) { bd = dd; best = i; } });
    if (best !== sel) { sel = best; drawWheel(); }
  };
  const up = () => {
    clearTimeout(timer); el.classList.remove('down'); el.removeEventListener('pointermove', move);
    if (open) { wheel.hidden = true; keys.classList.remove('dim'); const a = sel != null ? findAct(S.wheel[sel]) : null; if (a) runAct(a); else render(); }
    else { const d = S.demo; if (d.sel) { d.input = ' '; d.sel = false; } else d.input += ' '; render(); }
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up, { once: true });
  el.addEventListener('pointercancel', up, { once: true });
}

    case 'tab': S.tab = d.t; S.screen = 'home'; render(); break;
    case 'myf': S.myFilter = d.f; render(); break;
    case 'openSettings': S.coachGear = false; go('settings'); break;
    case 'open': e.stopPropagation(); S.detail = d.id; go('detail'); break;
    case 'add': e.stopPropagation(); { const i = S.added.indexOf(d.id); if (d.id === 'ai') break; if (i >= 0) S.added.splice(i, 1); else S.added.push(d.id); render(); } break;
    case 'jump': phone.querySelector('#sec-' + (d.c === 'translate' ? 'writing' : d.c))?.scrollIntoView({ behavior: 'smooth', block: 'start' }); break;
    case 'cat': S.cat = d.c; go('category'); break;
    case 'tryit': S.sheet = 'tryit'; S.tryOut = null; S.tryIn = null; render(); break;
    case 'runtry': { const a2 = findAct(S.detail); const inp = phone.querySelector('#tryin').value; S.tryIn = inp; if (S.credits <= 0) { render(); break; } S.credits--; S.tryRunning = true; render(); setTimeout(() => { S.tryRunning = false; S.tryOut = respond(a2, inp); S.history.unshift({ name: a2.name }); render(); }, 1200); } break;
    case 'assign': S.sheet = 'assign'; render(); break;
    case 'setkey': { const id = S.detail; for (const k in S.keys) if (S.keys[k] === id) delete S.keys[k]; if (d.key) { S.keys[d.key] = id; if (!S.added.includes(id)) S.added.push(id); } S.sheet = null; render(); toast(d.key ? `Assigned to “${d.key.toUpperCase()}”` : 'Assignment removed'); } break;
    case 'closeSheet': S.sheet = null; render(); break;
    case 'tog': { const k = d.k; if (k.startsWith('v.')) S.voice[k.slice(2)] = !S.voice[k.slice(2)]; else S.kb[k] = !S.kb[k]; render(); } break;
    case 'slot': if (+d.i !== 2) { S.sheet = 'slot' + d.i; render(); } break;
    case 'pickslot': S.wheel[+d.i] = d.id; S.sheet = null; render(); break;
    case 'plan': S.annual = d.y === 'true'; render(); break;
    case 'toast': toast(d.m); break;
    case 'agentsend': agentSend(d.t); break;
    case 'saveact': { const last = [...S.agent].reverse().find(m => m.p); if (last && !S.created.includes(last.p)) { S.created.unshift(last.p); S.added.push(last.p.id); S.agent.push({ t: `Saved! “${last.p.name}” is in My › Created and on your keyboard's Act tab.` }); render(); } } break;
    case 'reset': S.added = ['ai']; S.created = []; S.keys = {}; S.credits = 10; S.history = []; S.coachGear = true; S.stack = []; go('intro', false); break;
  }
});
phone.addEventListener('input', e => {
  const el = e.target; if (el.dataset.a !== 'range') return;
  const v = +el.value, k = el.dataset.k; if (k === 'pol') S.voice.pol = v; else S.kb[k] = v; render();
});
phone.addEventListener('submit', e => { e.preventDefault(); const inp = phone.querySelector('#agentin'); if (inp?.value.trim()) agentSend(inp.value.trim()); });
async function agentSend(t) {
  S.agent = S.agent || []; S.agent.push({ user: true, t }); S.agentThinking = true; render();
  await wait(1400); S.agentThinking = false;
  const name = t.split(' ').slice(0, 4).map(w => w[0].toUpperCase() + w.slice(1)).join(' ');
  const p = { id: 'c' + Date.now(), name, summary: t, overview: t, glyph: '✧', c1: '#D0BFFF', c2: '#7048E8', kind: 'custom', author: 'You', authorActs: 1, uses: 0, input: /clipboard|copied/i.test(t) ? 'Clipboard' : 'Text Entered', output: /append|link/i.test(t) ? 'Append After' : 'In-Place Replace', tools: [] };
  S.agent.push({ t: "Here's a plan for your Act. It reads the input, applies your instruction and delivers the result as shown.", p }); render();
  const log = phone.querySelector('#agentlog'); if (log) log.scrollTop = log.scrollHeight;
}

// intro auto demo loop
setInterval(() => { introBeat = (introBeat + 1) % BEATS.length; if (S.screen === 'intro' || S.screen === 'wheelSettings') render(); }, 2400);
render();
})();
</script>
